# =============================================================================
# Release binaries — builds the server (`certifi`) and CLI (`certifi-cli`) for
# linux, macOS and Windows and attaches them to the GitHub release for the
# tag. Windows also gets a legacy CLI build for Server 2012 R2 and older.
#
# Triggers:
#   • push of a vX.Y.Z tag  → build for that tag (creating the release if the
#     tag push didn't already).
#   • workflow_dispatch      → build for an existing tag passed as input (used
#     to attach binaries to a release whose tag was pushed before this workflow
#     existed).
#
# Each architecture builds NATIVELY on its own runner (amd64 on ubuntu-22.04,
# arm64 on ubuntu-24.04-arm) rather than cross-compiling — the server links
# against the system OpenSSL, which is painful to cross-compile but trivial to
# apt-install on a native runner.
# =============================================================================

name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.95.0"
  # Pinned nightly for the tier-3 x86_64-win7-windows-msvc legacy CLI build.
  # Keep in step with ci.yml.
  RUST_NIGHTLY_WIN7: "nightly-2026-10-01"

jobs:
  # Make sure a release exists for the tag before the build jobs upload to it.
  # On a fresh tag push this creates it; for a dispatch against an existing
  # release it's a no-op (so hand-written release notes are preserved).
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure a release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Certifi $TAG" --generate-notes
          fi

  build:
    needs: ensure-release
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux links the system OpenSSL (proven, fast). Empty `target` means
          # build for the runner's own host triple into target/release.
          - { os: linux,  arch: amd64, runner: ubuntu-22.04,     features: "",                               target: "" }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm, features: "",                               target: "" }
          # macOS statically links a vendored OpenSSL so the binary is
          # self-contained (no Homebrew dependency on the user's machine).
          - { os: darwin, arch: arm64, runner: macos-14,         features: "certifi-server/vendored-openssl", target: "" }
          # Intel macOS: the macos-13 (Intel) runners are being retired, so
          # cross-compile x86_64 ON the Apple-Silicon macos-14 runner. Apple's
          # clang is a universal cross-compiler and openssl-src vendors+builds
          # the x86_64 OpenSSL, so no macos-13 dependency remains.
          - { os: darwin, arch: amd64, runner: macos-14,         features: "certifi-server/vendored-openssl", target: "x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the released source, not whatever main happens to be.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: ver
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install system deps (OpenSSL)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # No-op when empty (native build); installs the cross target otherwise.
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          EXTRA=""
          [ -n "${{ matrix.features }}" ] && EXTRA="--features ${{ matrix.features }}"
          # Native build lands in target/release; a --target build lands in
          # target/<triple>/release. Record the dir so the stage step finds it.
          BINDIR="target/release"
          if [ -n "${{ matrix.target }}" ]; then
            EXTRA="$EXTRA --target ${{ matrix.target }}"
            BINDIR="target/${{ matrix.target }}/release"
          fi
          cargo build --release --locked -p certifi-server -p certifi-client $EXTRA
          echo "BINDIR=$BINDIR" >> "$GITHUB_ENV"

      - name: Stage + checksum artifacts
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PLAT="${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          cp "$BINDIR/certifi"     "dist/certifi-${TAG}-${PLAT}"
          cp "$BINDIR/certifi-cli" "dist/certifi-cli-${TAG}-${PLAT}"
          ( cd dist && shasum -a 256 certifi-* > "SHA256SUMS-${TAG}-${PLAT}.txt" )
          ls -la dist

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Windows: the standard .exe files (Windows 10 / Server 2016+) plus a legacy
  # CLI for Windows 7 / Server 2008 R2 / 2012 R2 — Rust's std dropped those
  # from the tier-1 target in 1.78, so that build uses the tier-3
  # x86_64-win7-windows-msvc target on a pinned nightly.
  build-windows:
    needs: ensure-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: ver
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      # Vendored OpenSSL (built with the runner's Strawberry Perl) so the
      # server .exe needs no OpenSSL install on the target machine.
      - name: Build release binaries
        run: cargo build --release --locked -p certifi-server -p certifi-client --features certifi-server/vendored-openssl

      - name: Install nightly for the legacy (win7) target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_WIN7 }}
          components: rust-src

      - name: Build legacy CLI
        # windows-targets 0.48 (still in the tree) ships import libraries only
        # for the exact x86_64-pc-windows-msvc triple; raw-dylib links the
        # Windows APIs without them. Setting RUSTFLAGS overrides
        # .cargo/config.toml, so the static-CRT flag is repeated here.
        env:
          RUSTFLAGS: --cfg windows_raw_dylib -C target-feature=+crt-static
        run: cargo +${{ env.RUST_NIGHTLY_WIN7 }} build --release --locked -p certifi-client -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc

      - name: Stage + checksum artifacts
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          cp target/release/certifi.exe     "dist/certifi-${TAG}-windows-amd64.exe"
          cp target/release/certifi-cli.exe "dist/certifi-cli-${TAG}-windows-amd64.exe"
          cp target/x86_64-win7-windows-msvc/release/certifi-cli.exe "dist/certifi-cli-${TAG}-windows-amd64-legacy.exe"
          scripts/check-windows-exe.sh "dist/certifi-${TAG}-windows-amd64.exe" "dist/certifi-cli-${TAG}-windows-amd64.exe"
          scripts/check-windows-exe.sh --legacy "dist/certifi-cli-${TAG}-windows-amd64-legacy.exe"
          ( cd dist && sha256sum certifi-* > "SHA256SUMS-${TAG}-windows-amd64.txt" )
          ls -la dist

      - name: Upload binaries to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
