# =============================================================================
# CI — runs on every PR, every push to main, and every vX.Y.Z tag.
#
# Gates a change on the same checks a maintainer would run locally:
#   • Rust: rustfmt, clippy (-D warnings), and the workspace test suite.
#   • Web:  the optional admin UI typechecks + builds.
#   • Docker: the production server image still builds from a clean checkout.
#   • Windows: the workspace builds and tests on Windows, and the .exe files
#     are uploaded as workflow artifacts (Actions → run → Artifacts).
#
# Jobs run in parallel; the Rust toolchain + cargo registry are cached between
# runs. Nothing is published — this is a validation pipeline.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the toolchain pinned in the Dockerfile.
  RUST_TOOLCHAIN: "1.95.0"
  # Pinned nightly for the tier-3 x86_64-win7-windows-msvc legacy CLI build.
  # Keep in step with release.yml.
  RUST_NIGHTLY_WIN7: "nightly-2026-10-01"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Format + lint + unit/integration tests for the Rust workspace.
  # ---------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (openssl for the `openssl` crate)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Windows: test the workspace natively and build the .exe files.
  #
  # The standard target (x86_64-pc-windows-msvc) needs Windows 10 / Server 2016
  # or newer — Rust's std stopped supporting older Windows in 1.78. The legacy
  # CLI is built for x86_64-win7-windows-msvc (Windows 7 / Server 2008 R2 and
  # up, so 2012 R2 boxes still running Exchange). That target is tier 3: it
  # needs a nightly toolchain and builds std from source.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      # The server links OpenSSL; vendor it (built with the runner's Strawberry
      # Perl) so the .exe doesn't need an OpenSSL install on the target box.
      - name: Test
        run: cargo test --workspace --features certifi-server/vendored-openssl

      - name: Build release binaries
        run: cargo build --release --locked -p certifi-server -p certifi-client --features certifi-server/vendored-openssl

      - name: Install nightly for the legacy (win7) target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_WIN7 }}
          components: rust-src

      - name: Build legacy CLI (Windows Server 2012 R2 and older)
        # windows-targets 0.48 (still in the tree) ships import libraries only
        # for the exact x86_64-pc-windows-msvc triple; raw-dylib links the
        # Windows APIs without them. Setting RUSTFLAGS overrides
        # .cargo/config.toml, so the static-CRT flag is repeated here.
        env:
          RUSTFLAGS: --cfg windows_raw_dylib -C target-feature=+crt-static
        run: cargo +${{ env.RUST_NIGHTLY_WIN7 }} build --release --locked -p certifi-client -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          cp target/release/certifi.exe     dist/certifi-windows-amd64.exe
          cp target/release/certifi-cli.exe dist/certifi-cli-windows-amd64.exe
          cp target/x86_64-win7-windows-msvc/release/certifi-cli.exe dist/certifi-cli-windows-amd64-legacy.exe
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: certifi-windows-amd64
          path: dist/*.exe
          if-no-files-found: error

      # Catch a runtime dependency before someone finds it on a server.
      - name: Check the .exe files run without extra runtimes
        shell: bash
        run: |
          rc=0
          scripts/check-windows-exe.sh dist/certifi-windows-amd64.exe dist/certifi-cli-windows-amd64.exe || rc=1
          scripts/check-windows-exe.sh --legacy dist/certifi-cli-windows-amd64-legacy.exe || rc=1
          exit $rc

  # ---------------------------------------------------------------------------
  # The optional React + Vite admin UI must typecheck and build.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Build (tsc -b + vite build)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Prove the production server image still builds from a clean checkout.
  # Build-only: nothing is pushed.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
